name: UseThatScreen
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  UseThatScreenProtocol:
    path: ../macos
targets:
  UseThatScreen:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: UseThatScreenProtocol
        product: UseThatScreenProtocol
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Use That Screen
        NSLocalNetworkUsageDescription: Find this iPad from your Mac or Windows PC on the same Wi-Fi.
        NSBonjourServices:
          - _usethatscreen._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usethatscreen.ipad
        TARGETED_DEVICE_FAMILY: 2
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
