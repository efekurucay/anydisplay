[package]
name = "anydisplay-win"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AnyDisplay Windows host: use an Android tablet as an extra display and pen tablet"
rust-version = "1.82"

[lib]
name = "anydisplay"
path = "src/lib.rs"

[[bin]]
name = "anydisplay-win"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
ctrlc = "3"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
mdns-sd = "0.21"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
