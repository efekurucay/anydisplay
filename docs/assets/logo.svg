<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>AnyDisplay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F4B"/>
      <stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="light" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#8A93A8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8A93A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1F232C"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E6EC"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1FF"/>
      <stop offset="0.5" stop-color="#9D7BFF"/>
      <stop offset="1" stop-color="#FF6FA8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#light)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="224" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8"/>
  <g transform="translate(-10 -24)">
    <!-- monitor -->
    <path d="M192 220h464a52 52 0 0 1 52 52v316a52 52 0 0 1 -52 52h-464a52 52 0 0 1 -52 -52v-316a52 52 0 0 1 52 -52z" fill="url(#body)"/>
    <path d="M192 250h464a22 22 0 0 1 22 22v274a22 22 0 0 1 -22 22h-464a22 22 0 0 1 -22 -22v-274a22 22 0 0 1 22 -22z" fill="url(#screen)"/>
    <path d="M170 250h300l-170 318h-130z" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="424" cy="604" r="9" fill="#B8BECC"/>
    <path d="M386 640h76l18 66h-112z" fill="#CDD2DC"/>
    <path d="M318 700h212a18 18 0 0 1 18 18v0a18 18 0 0 1 -18 18h-212a18 18 0 0 1 -18 -18v-0a18 18 0 0 1 18 -18z" fill="url(#body)"/>
    <!-- tablet in front, extending the monitor -->
    <path d="M590 428h264a60 60 0 0 1 60 60v336a60 60 0 0 1 -60 60h-264a60 60 0 0 1 -60 -60v-336a60 60 0 0 1 60 -60z" fill="#050A20" fill-opacity="0.55" filter="url(#shadow)"/>
    <path d="M580 404h264a60 60 0 0 1 60 60v336a60 60 0 0 1 -60 60h-264a60 60 0 0 1 -60 -60v-336a60 60 0 0 1 60 -60z" fill="url(#body)"/>
    <path d="M576 440h272a26 26 0 0 1 26 26v336a26 26 0 0 1 -26 26h-272a26 26 0 0 1 -26 -26v-336a26 26 0 0 1 26 -26z" fill="url(#screen)"/>
    <path d="M550 440h170l-120 388h-50z" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="712" cy="422" r="7" fill="#9AA2B4"/>
    <!-- an infinity loop drawn across both screens -->
    <path d="M560 512C726 435 895 532 820 662C745 792 576 694 560 512C544 330 375 232 300 362C225 492 394 589 560 512Z" fill="none" stroke="#8F7BFF" stroke-opacity="0.65" stroke-width="56" filter="url(#glow)"/>
    <path d="M560 512C726 435 895 532 820 662C745 792 576 694 560 512C544 330 375 232 300 362C225 492 394 589 560 512Z" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linejoin="round"/>
    <path d="M560 512C726 435 895 532 820 662C745 792 576 694 560 512C544 330 375 232 300 362C225 492 394 589 560 512Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
