name: Release

# The signed APK and the macOS app are attached by scripts/release.sh; this job adds the
# Windows host, which needs the MSVC toolchain of a Windows runner.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: windows
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $ver = $tag.TrimStart('v')
          $name = "UseThatScreen-$tag-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item windows/target/release/usethatscreen-win.exe, windows/target/release/usethatscreen-gui.exe $name/
          Copy-Item windows/README.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          # Fixed name for releases/latest/download/UseThatScreen-windows-x64.zip.
          Copy-Item "$name.zip" UseThatScreen-windows-x64.zip

          # Build Inno Setup installer
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          $setup = "UseThatScreen-$tag-windows-x64-setup"
          & $iscc "/DAppVersion=$ver" "/DOutputBaseFilename=$setup" windows/installer/usethatscreen.iss
          Copy-Item "windows/installer/out/$setup.exe" "$setup.exe"
          (Get-FileHash "$setup.exe" -Algorithm SHA256).Hash.ToLower() + "  $setup.exe" | Out-File -Encoding ascii "$setup.exe.sha256"
          # Fixed name for releases/latest/download/UseThatScreen-windows-x64-setup.exe.
          Copy-Item "$setup.exe" UseThatScreen-windows-x64-setup.exe
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $name = "UseThatScreen-$tag-windows-x64"
          $setup = "UseThatScreen-$tag-windows-x64-setup"
          gh release upload "$tag" `
            "$name.zip" "$name.zip.sha256" UseThatScreen-windows-x64.zip `
            "$setup.exe" "$setup.exe.sha256" UseThatScreen-windows-x64-setup.exe --clobber
