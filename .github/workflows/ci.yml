name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Vectors match tools/vectors.json
        run: python tools/anydisplay_ref.py vectors | diff - tools/vectors.json

  macos:
    name: macOS host
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift build -c release

  windows:
    name: Windows host
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo test
      - run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer/anydisplay.iss
      - name: Test installer PATH cleanup
        shell: pwsh
        timeout-minutes: 4
        run: |
          function Invoke-Setup([string]$FilePath, [string[]]$Arguments) {
            $log = Join-Path $env:RUNNER_TEMP 'anydisplay-setup-test.log'
            if (Test-Path $log) { Remove-Item $log }
            $process = Start-Process $FilePath -ArgumentList (
              $Arguments + @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="' + $log + '"'))
            ) -PassThru
            if (-not $process.WaitForExit(30000)) {
              if (Test-Path $log) { Get-Content $log }
              throw "$FilePath did not finish within 30 seconds"
            }
            if (Test-Path $log) { Get-Content $log }
            if ($process.ExitCode -ne 0) { throw "$FilePath exited with code $($process.ExitCode)" }
          }

          $setup = Resolve-Path installer/out/AnyDisplay-windows-x64-setup.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'AnyDisplay Install'
          $environmentKey = 'HKCU:\Environment'
          $basePath = 'C:\other;C:\tools;'
          foreach ($test in @(
            @{ Tasks = 'addtopath'; Before = $basePath; Installed = "$basePath;$installDir" },
            @{ Tasks = 'addtopath'; Before = "C:\other;$installDir;C:\tools;"; Installed = "C:\other;$installDir;C:\tools;" },
            @{ Tasks = 'desktopicon'; Before = "C:\other;$installDir;C:\tools;"; Installed = "C:\other;$installDir;C:\tools;" }
          )) {
            Set-ItemProperty -Path $environmentKey -Name Path -Value $test.Before
            Invoke-Setup $setup @('/SP-', '/CURRENTUSER', ('/DIR="' + $installDir + '"'), "/TASKS=$($test.Tasks)")
            if ((Get-ItemPropertyValue $environmentKey Path) -cne $test.Installed) {
              throw "Unexpected PATH after installing with tasks $($test.Tasks)"
            }
            Invoke-Setup (Join-Path $installDir 'unins000.exe') @()
            if ((Get-ItemPropertyValue $environmentKey Path) -cne $test.Before) {
              throw "Uninstall did not restore the original PATH for tasks $($test.Tasks)"
            }
          }
      - name: Test display resolution configuration
        shell: powershell
        run: |
          $settings = Join-Path $env:RUNNER_TEMP 'vdd_settings.xml'
          '<vdd_settings><resolutions><resolution><width>2000</width><height>1200</height><refresh_rate>60</refresh_rate></resolution></resolutions></vdd_settings>' |
            Set-Content -LiteralPath $settings -Encoding UTF8
          & .\installer\add-vdd-resolutions.ps1 -SettingsPath $settings
          $hash = (Get-FileHash $settings).Hash
          [xml]$config = Get-Content -LiteralPath $settings -Raw
          if ($config.SelectNodes('/vdd_settings/resolutions/resolution[refresh_rate=60]').Count -ne 16) {
            throw 'Expected 16 display resolutions at 60 Hz'
          }
          & .\installer\add-vdd-resolutions.ps1 -SettingsPath $settings
          if ((Get-FileHash $settings).Hash -ne $hash) { throw 'Applying resolutions twice changed the file' }
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-win
          path: |
            windows/target/release/anydisplay-win.exe
            windows/target/release/anydisplay-gui.exe
            windows/installer/out/AnyDisplay-windows-x64-setup.exe

  android:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
